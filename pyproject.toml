[project]
name = "portfolio-goal-planner"
version = "0.1.0"
description = "Goal-based portfolio planner: Monte Carlo plus mean-variance analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
live = ["yfinance>=0.2.40"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
